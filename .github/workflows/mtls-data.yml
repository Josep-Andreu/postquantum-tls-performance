name: Validate current mTLS campaign
on:
  push:
    paths:
      - 'mtls/**'
      - '.github/workflows/mtls-data.yml'
  pull_request:
    paths:
      - 'mtls/**'
      - '.github/workflows/mtls-data.yml'
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check dataset internal consistency
        run: python3 mtls/scripts/verify-campaign.py
      - name: Install plotting dependencies
        run: pip install -r mtls/requirements.txt
      - name: Rebuild 8 offline figures (do not modify committed server originals)
        run: |
          python3 mtls/scripts/plot-mtls-campaign-dark.py \
            --csv mtls/data/results.csv \
            --out "$RUNNER_TEMP/mtls-plots"
          test "$(find "$RUNNER_TEMP/mtls-plots" -name '*.png' | wc -l)" -eq 8
          test "$(find "$RUNNER_TEMP/mtls-plots" -name '*.svg' | wc -l)" -eq 8
